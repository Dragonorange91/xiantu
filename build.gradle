buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
apply plugin: 'org.spongepowered.mixin'
mixin { add sourceSets.main, 'xiantu.refmap.json'; config 'xiantu.mixins.json' }
def pythonExecutable = providers.gradleProperty('pythonCommand').orElse('py').get()
def pythonLauncherArgs = pythonExecutable == 'py' ? ['-3'] : []
group = 'com.longju.xiantu'
version = '0.1.0'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { xiantu { source sourceSets.main } }
        }
        client { args '--username', 'Dev' }
        server { args '--nogui' }
    }
}
// Official API for compilation only. The pinned, optimized runtime is nested below.
repositories {
    flatDir { dirs 'libs' }
    maven { url = 'https://maven.minecraftforge.net' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.26'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf('org.lytharalab.gfbs:gfbs_gltf:1.5.1:all')
    implementation fg.deobf('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.11')
    // Optional client API only. Photon supplies its own nested LDLib at runtime.
    compileOnly files('libs/photon-forge-1.20.1-1.1.17.jar', 'libs/ldlib-forge-1.20.1-1.0.42.jar')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
