jar { manifest { attributes(['Specification-Title':'仙途','Specification-Vendor':'龙橘','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.jar.archiveVersion,'Implementation-Vendor':'龙橘']) } }

// Forge Jar-in-Jar layout, copied without unpacking or remapping GFBS. This also
// preserves its own six nested libraries and mixin manifest. Keep the normal
// reobfJar release path; the separate QA mod must not embed a second runtime.
def embeddedGfbsResources = layout.buildDirectory.dir('generated/gfbs-embedded')
tasks.register('prepareEmbeddedGfbs', Exec) {
    inputs.files('libs/gfbs_gltf-1.5.1-xiantu-optimized.jar',
            'libs/GFBS-glTF-LICENSE.txt', 'tools/prepare_embedded_gfbs.py',
            'tools/verify_gfbs_runtime.py')
    outputs.dir(embeddedGfbsResources)
    commandLine pythonExecutable, *pythonLauncherArgs, 'tools/prepare_embedded_gfbs.py',
            '--output', embeddedGfbsResources.get().asFile.absolutePath
}
tasks.named('jar', Jar) {
    dependsOn 'prepareEmbeddedGfbs'
    from(embeddedGfbsResources)
}
tasks.register('verifyEmbeddedGfbsSource', Exec) {
    commandLine pythonExecutable, *pythonLauncherArgs, 'tools/verify_gfbs_runtime.py', '--source-only'
}
tasks.named('check') { dependsOn 'verifyEmbeddedGfbsSource' }

